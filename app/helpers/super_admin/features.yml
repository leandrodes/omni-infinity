# TODO: Move this values to features.yml itself
# No need to replicate the same values in two places

# ------- Recursos Premium ------- #
saml:
  name: 'SAML SSO'
  description: 'Configuração para controlar a disponibilidade do SAML Single Sign-On'
  enabled: <%= ChatwootApp.enterprise? %>
  icon: 'icon-lock-line'
  config_key: 'saml'
  enterprise: true
custom_branding:
  name: 'Marca Personalizada'
  description: 'Aplique sua própria marca a esta instalação.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-paint-brush-line'
  config_key: 'custom_branding'
  enterprise: true
agent_capacity:
  name: 'Capacidade do Agente'
  description: 'Defina limites para atribuir conversas automaticamente aos seus agentes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-hourglass-line'
  enterprise: true
audit_logs:
  name: 'Logs de Auditoria'
  description: 'Acompanhe e rastreie as atividades da conta com logs de auditoria detalhados.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-menu-search-line'
  enterprise: true
disable_branding:
  name: 'Desativar Marca'
  description: 'Desativa a marca no widget de chat ao vivo e nos e-mails externos.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-sailbot-fill'
  enterprise: true
voice_calls:
  name: 'Chamadas de Voz'
  description: 'Habilita recursos de chamadas de voz para seus agentes e clientes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-voice-line'
  enterprise: true

# ------- Recursos do Produto ------- #
help_center:
  name: 'Central de Ajuda'
  description: 'Permite que os agentes criem artigos da central de ajuda e os publiquem em um portal.'
  enabled: true
  icon: 'icon-book-2-line'
transcription:
  name: 'Transcrição'
  description: 'Configure o endpoint de transcrição de áudio (ex.: Whisper) para transcrever os áudios recebidos nos canais de WhatsApp.'
  enabled: true
  icon: 'icon-mic-line'
  config_key: 'transcription'

# ------- Canais de Comunicação ------- #
live_chat:
  name: 'Chat ao Vivo'
  description: 'Melhore a experiência dos seus clientes usando um chat ao vivo no seu site.'
  enabled: true
  icon: 'icon-chat-smile-3-line'
email:
  name: 'E-mail'
  description: 'Gerencie as interações por e-mail com seus clientes pelo Omni-Channel.'
  enabled: true
  icon: 'icon-mail-send-fill'
  config_key: 'email'
sms:
  name: 'SMS'
  description: 'Gerencie as interações por SMS com seus clientes pelo Omni-Channel.'
  enabled: true
  icon: 'icon-message-line'
messenger:
  name: 'Messenger'
  description: 'Mantenha-se conectado com seus clientes no Facebook e Instagram.'
  enabled: true
  icon: 'icon-messenger-line'
  config_key: 'facebook'
instagram:
  name: 'Instagram'
  description: 'Mantenha-se conectado com seus clientes no Instagram'
  enabled: true
  icon: 'icon-instagram'
  config_key: 'instagram'
whatsapp:
  name: 'WhatsApp'
  description: 'Gerencie as interações de WhatsApp Business com seus clientes pelo Omni-Channel.'
  enabled: true
  icon: 'icon-whatsapp-line'
unofficial_whatsapp:
  name: 'WhatsApp Não Oficial'
  description: 'Configure os servidores WuzAPI, UazAPI e Evolution API usados pelo canal de WhatsApp não oficial.'
  enabled: true
  icon: 'icon-whatsapp-line'
  config_key: 'unofficial_whatsapp'
telegram:
  name: 'Telegram'
  description: 'Gerencie as interações por Telegram com seus clientes pelo Omni-Channel.'
  enabled: true
  icon: 'icon-telegram-line'
google:
  name: 'Google'
  description: 'Configuração para a integração OAuth do Google'
  enabled: true
  icon: 'icon-google'
  config_key: 'google'
microsoft:
  name: 'Microsoft'
  description: 'Configuração para o e-mail da Microsoft'
  enabled: true
  icon: 'icon-microsoft'
  config_key: 'microsoft'
