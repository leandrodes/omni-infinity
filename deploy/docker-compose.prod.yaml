x-base: &base
  image: ghcr.io/leandrodes/omni-infinity:${OMNI_IMAGE_TAG:-latest}
  env_file: .env
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # Caddy NÃO roda mais como container: é instalado e gerenciado no host
  # (systemd) pelo install.sh. O Caddy do host faz o reverse proxy/HTTPS para
  # os serviços abaixo, que ficam expostos apenas em 127.0.0.1.

  # OPCIONAIS - ativados via Docker Compose profiles (definidos em .env: COMPOSE_PROFILES)
  wuzapi:
    profiles: ["wuzapi"]
    build:
      context: ./wuzapi
    restart: always
    volumes:
      - wuzapi_data:/app/dbdata
      - wuzapi_files:/app/files
    env_file: .env
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN:-changeme}
    ports:
      - '127.0.0.1:8080:8080'

  evolution:
    profiles: ["evolution"]
    image: evoapicloud/evolution-api:v2.3.7
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - SERVER_URL=${EVOLUTION_PUBLIC_URL:-http://evolution:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - CONFIG_SESSION_PHONE_CLIENT=Omni Infinity
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754
      - LANGUAGE=pt-BR
      - WEBHOOK_GLOBAL_ENABLED=false
      - DEL_INSTANCE=false
      - LOG_LEVEL=ERROR
      - LOG_BAILEYS=error
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - evolution_instances:/evolution/instances

  wacalls:
    profiles: ["wacalls"]
    build:
      context: ./wacalls
    restart: always
    ports:
      - '127.0.0.1:8082:8080'
    volumes:
      - wacalls_data:/data
    env_file: .env
    environment:
      - WACALLS_API_KEY=${WACALLS_API_KEY}
      - WACALLS_ALLOWED_ORIGINS=${WACALLS_ALLOWED_ORIGINS:-}
      - WACALLS_MAX_CALLS=${WACALLS_MAX_CALLS:-8}

  portainer:
    profiles: ["portainer"]
    image: portainer/portainer-ce:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - '127.0.0.1:9000:9000'

  # Transcrição de áudio (Whisper). Exposto apenas internamente em
  # http://whisper:9000 (usado pelo Omni-Channel). A porta do host (9005) serve
  # só para depuração local.
  whisper:
    profiles: ["whisper"]
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: always
    environment:
      - ASR_ENGINE=${WHISPER_ENGINE:-faster_whisper}
      - ASR_MODEL=${WHISPER_MODEL:-base}
      - ASR_DEVICE=cpu
    volumes:
      - whisper_cache:/root/.cache
    ports:
      - '127.0.0.1:9005:9000'

volumes:
  storage_data:
  postgres_data:
  redis_data:
  wuzapi_data:
  wuzapi_files:
  evolution_instances:
  wacalls_data:
  portainer_data:
  whisper_cache:
